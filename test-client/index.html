<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Ops Socket Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #connectionStatus {
            padding: 12px;
            background: #eee;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #logs {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            color: #00ff88;
            min-height: 300px;
            white-space: pre-wrap;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>Live Ops Helpdesk Socket Test</h1>

    <p id="connectionStatus">
        Connecting...
    </p>

    <hr>

    <h2>Agent</h2>

    <button onclick="joinAsAgent('Agent A')">
        Join as Agent A
    </button>

    <button onclick="joinAsAgent('Agent B')">
        Join as Agent B
    </button>

    <hr>

    <h2>Ticket Lock Test</h2>

    <button onclick="lockTicket()">
        Lock Ticket 105
    </button>

    <button onclick="unlockTicket()">
        Unlock Ticket 105
    </button>

    <button onclick="disconnectSocket()">
        Disconnect Socket
    </button>

    <div id="logs"></div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <script>
        console.log("===== SOCKET TEST STARTED =====");

        const socket = io("http://localhost:5000");

        const connectionStatus =
            document.getElementById("connectionStatus");

        const logs =
            document.getElementById("logs");

        const TEST_TICKET_ID = "105";


        // ==========================================
        // HELPER
        // ==========================================

        function log(message, data = null) {

            console.log(message, data || "");

            logs.textContent +=
                message +
                (data ? "\n" + JSON.stringify(data, null, 2) : "") +
                "\n\n";
        }


        // ==========================================
        // CONNECTION
        // ==========================================

        socket.on("connect", () => {

            log("✅ SOCKET CONNECTED");

            log("Socket ID:", socket.id);

            connectionStatus.textContent =
                `Connected: ${socket.id}`;
        });


        socket.on("connect_error", (error) => {

            log("❌ SOCKET CONNECTION ERROR");

            log(error.message);

            connectionStatus.textContent =
                "Connection error";
        });


        // ==========================================
        // JOIN DASHBOARD
        // ==========================================

        function joinAsAgent(agentName) {

            log("🔵 JOIN DASHBOARD");

            log("Agent:", agentName);

            log("Socket connected:", socket.connected);

            socket.emit(
                "join_dashboard",
                agentName
            );
        }


        socket.on("dashboard_joined", (data) => {

            log("✅ DASHBOARD JOINED");

            log("Server response:", data);

            connectionStatus.textContent =
                `${data.message} - ${data.agentName}`;
        });


        // ==========================================
        // LOCK TICKET
        // ==========================================

        function lockTicket() {

            log("🔒 LOCKING TICKET");

            log("Ticket ID:", TEST_TICKET_ID);

            socket.emit(
                "lock_ticket",
                TEST_TICKET_ID
            );
        }


        socket.on("ticket_locked", (data) => {

            log("🔒 TICKET LOCKED");

            log("Lock data:", data);
        });


        socket.on("lock_failed", (data) => {

            log("❌ LOCK FAILED");

            log("Server response:", data);
        });


        // ==========================================
        // UNLOCK TICKET
        // ==========================================

        function unlockTicket() {

            log("🔓 UNLOCKING TICKET");

            log("Ticket ID:", TEST_TICKET_ID);

            socket.emit(
                "unlock_ticket",
                TEST_TICKET_ID
            );
        }


        socket.on("ticket_unlocked", (data) => {

            log("🔓 TICKET UNLOCKED");

            log("Unlock data:", data);
        });


        socket.on("unlock_failed", (data) => {

            log("❌ UNLOCK FAILED");

            log("Server response:", data);
        });


        // ==========================================
        // TICKET CREATED
        // ==========================================

        socket.on("ticket_created", (data) => {

            log("🆕 TICKET CREATED");

            log("New ticket:", data);
        });


        // ==========================================
        // TICKET CLAIMED
        // ==========================================

        socket.on("ticket_claimed", (data) => {

            log("📋 TICKET CLAIMED");

            log("Claim data:", data);
        });


        // ==========================================
        // DISCONNECT
        // ==========================================

        function disconnectSocket() {

            log("⚠️ MANUALLY DISCONNECTING SOCKET");

            socket.disconnect();
        }


        socket.on("disconnect", (reason) => {

            log("❌ SOCKET DISCONNECTED");

            log("Reason:", reason);

            connectionStatus.textContent =
                `Disconnected: ${reason}`;
        });

    </script>

</body>
</html>
