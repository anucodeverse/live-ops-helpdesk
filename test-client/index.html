<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RapidDispatch Live Ops</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Socket.io client from deployed backend -->
    <script
        src="https://live-ops-helpdesk-3an1.onrender.com/socket.io/socket.io.js"
    ></script>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div>
            <h1>RapidDispatch Live Ops</h1>
            <p>Real-Time Ticket Operations</p>
        </div>

        <div
            id="connectionStatus"
            class="connection offline"
        >
            <span class="status-dot"></span>
            Connecting...
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- ================= AGENT PANEL ================= -->

        <section class="agent-panel">

            <div>
                <span class="section-label">
                    ACTIVE AGENT
                </span>

                <h2 id="agentName">
                    Not selected
                </h2>
            </div>

            <div class="agent-buttons">

                <button
                    id="agentAButton"
                    class="agent-button"
                    onclick="joinAsAgent('Agent A')"
                >
                    Agent A
                </button>

                <button
                    id="agentBButton"
                    class="agent-button"
                    onclick="joinAsAgent('Agent B')"
                >
                    Agent B
                </button>

            </div>

        </section>


        <!-- ================= STATS ================= -->

        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Tickets</span>
                <strong id="totalTickets">0</strong>
            </div>

            <div class="stat-card">
                <span>Available</span>
                <strong id="availableTickets">0</strong>
            </div>

            <div class="stat-card">
                <span>Locked</span>
                <strong id="lockedTickets">0</strong>
            </div>

            <div class="stat-card">
                <span>Connection</span>
                <strong id="connectionText">
                    Offline
                </strong>
            </div>

        </section>


        <!-- ================= TICKETS ================= -->

        <section class="tickets-section">

            <div class="section-header">

                <div>
                    <span class="section-label">
                        LIVE QUEUE
                    </span>

                    <h2>Support Tickets</h2>
                </div>

                <button
                    class="refresh-button"
                    onclick="loadTickets()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div
                id="ticketContainer"
                class="ticket-grid"
            >

                <div class="empty-state">
                    Loading tickets...
                </div>

            </div>

        </section>


        <!-- ================= ACTIVITY ================= -->

        <section class="activity-section">

            <div class="section-header">

                <div>
                    <span class="section-label">
                        REAL-TIME EVENTS
                    </span>

                    <h2>Activity</h2>
                </div>

                <button
                    class="clear-button"
                    onclick="clearLogs()"
                >
                    Clear
                </button>

            </div>

            <div
                id="activityLog"
                class="activity-log"
            >

                <div class="log-item">
                    <span class="log-time">
                        --:--
                    </span>

                    <span>
                        Waiting for connection...
                    </span>
                </div>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
